apiVersion: v1
kind: Namespace
metadata:
  name: kustom-namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: protect-kustom-namespace
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["namespaces"]
  validations:
    - expression: "oldObject.metadata.name != 'kustom-namespace'"
      message: "The kustom-namespace namespace is protected from deletion."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: protect-kustom-namespace
spec:
  policyName: protect-kustom-namespace
  validationActions: [Deny]
